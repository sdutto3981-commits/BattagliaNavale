<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battaglia Navale</title>
    <link rel="stylesheet" href="style.css" />
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1>Battaglia Navale</h1>

    <div class="controls">
      <button class="btn btn-outline-secondary me-2" type="button" id="toggle-settings">
        Impostazioni
      </button>
      <button class="btn btn-outline-success me-2" type="button" id="start-game">
        Inizia partita
      </button>
      <button class="btn btn-outline-danger" type="button" id="reset-game">
        Reset
      </button>
    </div>

    <div id="settings-panel">
      <div class="setting-group">
        <label for="grid-size">Dimensione griglia</label>
        <input type="number" id="grid-size" min="5" max="12" value="8" />
      </div>
      <div class="setting-group">
        <label for="num-ships">Numero di navi</label>
        <input type="number" id="num-ships" min="1" max="6" value="5" />
      </div>
      <div class="setting-group ship-sizes-group">
        <label>Lunghezza di ogni nave</label>
        <div id="ship-sizes-inputs"></div>
      </div>
      <p id="settings-error"></p>
    </div>

    <div id="game">
        <div id="grid-wrapper">

        </div>
        <div id="menu">
            <p id="message">Premi "Inizia partita" per giocare!</p>
            <p id="hits">Colpi a segno: 0</p>
            <p id="timer"><span id="min">00</span>:<span id="sec">00</span></p>
            <div id="ships-list"></div>
        </div>
    </div>

    <div id="leaderboard-wrapper">
      <h2>Classifica</h2>
      <div id="leaderboard">
        <p id="leaderboard-empty">Nessun punteggio ancora registrato.</p>
      </div>
    </div>

    <!-- Modal punteggio di fine partita -->
    <div class="modal fade" id="score-modal" tabindex="-1" aria-labelledby="score-modal-label" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="score-modal-label">Flotta nemica distrutta!</h5>
          </div>
          <div class="modal-body">
            <div class="score-summary">
              <p>Tempo impiegato: <strong id="modal-time">00:00</strong></p>
              <p>Tentativi totali: <strong id="modal-attempts">0</strong></p>
              <p>Punteggio: <strong id="modal-score">0</strong></p>
            </div>
            <div class="mb-3">
              <label for="player-name" class="form-label">Inserisci il tuo nome</label>
              <input type="text" id="player-name" class="form-control" maxlength="20" placeholder="Ammiraglio..." />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Chiudi</button>
            <button type="button" class="btn btn-success" id="save-score-btn">Salva punteggio</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
