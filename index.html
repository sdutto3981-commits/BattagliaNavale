<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battaglia Navale</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1>Battaglia Navale</h1>
    <div class="controls">
      <button class="btn btn-outline-success me-2" type="button" id="start-game">
        Inizia partita
      </button>
      <button class="btn btn-outline-danger" type="button" id="reset-game">
        Reset
      </button>
    </div>
    <div id="game">
        <div id="grid-wrapper">

        </div>
        <div id="menu">
            <p id="message">Premi "Inizia partita" per giocare!</p>
            <p id="hits">Colpi a segno: 0</p>
            <p id="timer"><span id="min">00</span>:<span id="sec">00</span></p>
            <div id="ships-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
